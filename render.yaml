services:
  - type: web
    name: tiho-django-react
    runtime: docker
    branch: feat/django-react
    plan: free
    region: frankfurt
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tiho-postgres
          property: connectionString

databases:
  - name: tiho-postgres
    plan: free
    region: frankfurt
    databaseName: tiho
    user: tiho
    ipAllowList: []
